{% extends 'shop/base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <form method="GET" class="d-flex">
            <input type="text" name="q" class="form-control me-2" placeholder="Search products..." value="{{ query }}">
            <button class="btn btn-outline-primary" type="submit">Search</button>
        </form>
    </div>
    <div class="col-md-4">
        <select class="form-select" onchange="location = this.value;">
            <option value="{% url 'home' %}">All Categories</option>
            {% for cat in categories %}
                <option value="?category={{ cat.slug }}" {% if selected_category == cat.slug %}selected{% endif %}>
                    {{ cat.name }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
            {% else %}
                <div class="bg-secondary text-white text-center py-5">No Image Available</div>
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text text-muted">${{ product.price }}</p>
                <a href="{% url 'product_detail' product.slug %}" class="btn btn-outline-secondary btn-sm">Details</a>
                <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary btn-sm float-end">Add to Cart</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12"><p class="alert alert-warning">No products found.</p></div>
    {% endfor %}
</div>
{% endblock %}
