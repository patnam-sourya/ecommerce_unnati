{% extends 'shop/base.html' %}

{% block content %}
<div class="text-center py-5">
    <div class="card p-5 shadow-sm d-inline-block">
        <h1 class="text-success display-4">✔ Payment Successful!</h1>
        <p class="lead mt-3">Thank you for your order, <strong>{{ order.full_name }}</strong>.</p>
        <p>Order ID: <code>#{{ order.id }}</code></p>
        <p>Payment Reference: <code>{{ order.razorpay_payment_id }}</code></p>
        <hr>
        <a href="{% url 'home' %}" class="btn btn-primary mt-3">Continue Shopping</a>
    </div>
</div>
{% endblock %}
