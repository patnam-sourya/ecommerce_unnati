{% extends 'shop/base.html' %}

{% block content %}
<h2>My Wishlist</h2>
<div class="row mt-4">
    {% for item in wishlist_items %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5>{{ item.product.name }}</h5>
                <p class="text-success">${{ item.product.price }}</p>
                <a href="{% url 'product_detail' item.product.slug %}" class="btn btn-outline-primary btn-sm">View</a>
                <a href="{% url 'toggle_wishlist' item.product.id %}" class="btn btn-outline-danger btn-sm float-end">Remove</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12"><div class="alert alert-info">Your wishlist is empty!</div></div>
    {% endfor %}
</div>
{% endblock %}
